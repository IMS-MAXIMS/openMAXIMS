<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <title>openMAXIMS Standards Port</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    #cn_progressBar {
      font: 11px Tahoma, sans-serif;
      height: 100%; width: 100%; position: relative; text-align: center;
    }
    #cn_progressBar .message {
      position: relative; top: 45%; width: 268px;
      padding: 12px 10px 8px; margin: 0 auto;
      background: #fff; border: 1px solid #7ca8d5;
    }
    #cn_progressBar img { margin-top: 4px; width: 250px; height: 16px; }
  </style>
</head>
<body>
  <div id="cn_progressBar">
    <div class="message">
      Application is loading, please wait.
      <br><img src="g/und-progress-bar-1.gif" alt="">
    </div>
  </div>
  <div id="cn_globalPlaceholder"></div>
  <script>
    // Always keep the Standards Port bundle, bootstrap, and packed theme in
    // one browser-cache generation. This matters after rebuilding a WAR:
    // Safari otherwise combines a new launcher with an older cached client.
    window.__openmaximsStandardsPortAssetVersion = String(Date.now());
    (function() {
      var version = encodeURIComponent(window.__openmaximsStandardsPortAssetVersion);
      var bundle = document.createElement("script");
      bundle.src = "packed/jscn.js.gz?v=" + version;
      bundle.onload = function() {
        var bootstrap = document.createElement("script");
        bootstrap.src = "jsCN/source/build/files/forminit.js?v=" + version;
        document.body.appendChild(bootstrap);
      };
      document.body.appendChild(bundle);
    })();
  </script>
</body>
</html>
